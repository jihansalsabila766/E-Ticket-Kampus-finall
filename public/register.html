<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Daftar Admin | E-Ticket Kampus</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">

  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #6610f2, #0d6efd);
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .card {
      background: rgba(255,255,255,0.1);
      backdrop-filter: blur(10px);
      border-radius: 20px;
      padding: 40px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.3);
    }
    .form-control {
      border-radius: 10px;
      background: rgba(255,255,255,0.2);
      border: none;
      color: #fff;
    }
    .form-control::placeholder { color: rgba(255,255,255,0.7); }
    .btn {
      border-radius: 10px;
      font-weight: 600;
    }
    a { color: #ffc107; text-decoration: none; }
  </style>
</head>
<body>
  <div class="card">
    <h3 class="text-center mb-4"><i class="bi bi-person-plus"></i> Daftar Admin</h3>
    <form id="registerForm">
      <div class="mb-3">
        <input type="text" id="name" class="form-control" placeholder="Nama Lengkap" required>
      </div>
      <div class="mb-3">
        <input type="email" id="email" class="form-control" placeholder="Email" required>
      </div>
      <div class="mb-3">
        <input type="password" id="password" class="form-control" placeholder="Kata Sandi" required>
      </div>
      <button type="submit" class="btn btn-warning w-100">Daftar</button>
      <p class="text-center mt-3">Sudah punya akun? <a href="login.html">Masuk</a></p>
    </form>
  </div>

  <script>
    // Jika sudah login, langsung arahkan ke admin
    if (localStorage.getItem('adminToken')) {
      window.location.href = "admin.html";
    }

    document.getElementById("registerForm").addEventListener("submit", function(e) {
      e.preventDefault();

      const name = document.getElementById("name").value.trim();
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value.trim();

      if (localStorage.getItem(email)) {
        alert("Email sudah terdaftar! Silakan login.");
        return;
      }

      const newAdmin = { name, email, password };
      localStorage.setItem(email, JSON.stringify(newAdmin));
      alert("Pendaftaran berhasil! Silakan login.");
      window.location.href = "login.html";
    });
  </script>
</body>
</html>
